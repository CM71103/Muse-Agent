# Muse Agent configuration
# Lives at ~/.muse-agent/config.toml (or $MUSE_HOME/config.toml)
# Copy this file there, or the app creates it on first run.
# Syntax: [section] headers, key = value. Arrays: ["a", "b"]. # = comment.

[llm]
# OpenAI-compatible endpoint. Works with DeepSeek, OpenAI, OpenRouter,
# vLLM, LM Studio, Ollama (http://localhost:11434/v1), SiliconFlow, etc.
provider = "openai-compat"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
# API key: prefer the env var named below (never stored in this file).
api_key_env = "MUSE_LLM_API_KEY"
# Or hard-set a key here (not recommended):
# api_key = "sk-..."
temperature = 0.3
max_tokens = 8192

# --- common presets, uncomment and fill in ---
# OpenAI:      base_url = "https://api.openai.com/v1"           model = "gpt-4o"
# OpenRouter:  base_url = "https://openrouter.ai/api/v1"        model = "anthropic/claude-sonnet-4"
# Ollama:      base_url = "http://localhost:11434/v1"           model = "qwen2.5:14b"
# LM Studio:   base_url = "http://localhost:1234/v1"            model = "whatever-is-loaded"

[agent]
# Hard cap on tool loop per user message.
max_turns = 40
# Auto-deny approval after this many seconds (nanoMuse default: 1 hour).
approval_timeout_s = 3600
# Legacy field retained for compatibility. Auto mode runs tools without prompts,
# including shell commands, even when an older config lists "shell" here.
always_ask_tools = []
# Sandbox: none on Windows (approved commands run unsandboxed — same reality
# as nanoMuse). Bubblewrap mode is Linux-only and not implemented in v0.1.
sandbox = "none"

[sentinel]
# Permission mode (Claude Code-style). Switchable live from the sidebar "Mode" button.
#   "ask"          — side effects always prompt for approval (safest, default)
#   "accept_edits" — writes inside the project folder auto-approve; shell/web still ask
#   "plan"         — read-only: writes, shell, web are blocked outright
#   "auto"         — all known tools and shell commands run without approval prompts
# Deny rules and fail-closed unknown tools hold in EVERY mode.
mode = "ask"
# Glob patterns matched against the whole rendered tool call (* = any text).
deny_rules = [
  "*rm -rf*",
  "*del /s*",
  "*format *",
  "*Remove-Item -Recurse*",
  "*shutdown*",
  "*reg delete*",
]
# After the agent reads a private file, web_fetch is limited to these hosts.
egress_allowlist = ["duckduckgo.com", "wikipedia.org", "github.com", "pypi.org"]

[mcp]
# MCP (Model Context Protocol) servers — extend the agent with third-party
# tools (Antigravity-style). Stdio transport only; OFF until you list servers.
# Every MCP tool call still requires approval in the UI (conservative default).
# servers = ["docs"]
#
# [mcp.server.docs]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "D:/projects"]
# env = []            # optional ["VAR=value"]
# timeout_s = 60
#
# --- OpenViking context-database spike (optional) ---
# Requires: OpenViking server running locally (`openviking-server`, default
# http://127.0.0.1:1933) and a user/admin API key from it. mcp-remote bridges
# OpenViking's Streamable-HTTP MCP endpoint to stdio for us. See
# docs/openviking-spike.md before enabling.
#
# servers = ["viking"]
#
# [mcp.server.viking]
# command = "npx"
# args = ["-y", "mcp-remote", "http://127.0.0.1:1933/mcp",
#        "--header", "Authorization:${MUSE_VIKING_KEY}"]
# env = []            # set MUSE_VIKING_KEY in your environment instead of here
# timeout_s = 120

[bridge]
# Host bridge: loopback HTTP API into the RUNNING agent (Antigravity host-bridge).
# Scripts/hotkeys drive the same live instance the app uses.
# Binds 127.0.0.1 only. Bearer token at ~/.muse-agent/bridge_token.
# Port: 0 = ephemeral (printed to main-process log each start).
enabled = true
port = 0

[log]
level = "info"
# dir = "C:/muse-logs"   # default ~/.muse-agent/logs

[memory]
# Adaptive memory layer (Phase 0 baseline). ON by default — it stores your
# conversation and tool results in ~/.muse-agent/memory. Set false to opt out;
# if the chat endpoint has no /embeddings, turns degrade to memoryless.
enabled = true
# Fixed token allowance for retrieved memories per turn (spec §4.3 clamp:
# context_limit − other_input − output_reserve − 256, may clamp to 0).
budget_tokens = 1200
score_cutoff = 0.20
# auto = Git root → opaque registry id (worktrees are separate scopes).
# manual = requires project_id passed by the host; detection failure surfaces
# a prompt, never a silent fallback.
project_id_strategy = "auto"
# Embeddings default to text-embedding-3-small on the chat endpoint.
# Point at a dedicated endpoint if yours lacks /embeddings:
# embed_base_url = "https://api.openai.com/v1"
embed_model = "text-embedding-3-small"
# embed_dims: 0 = auto-detect from the first successful embeddings call
embed_dims = 0
# Layer-own provider spend per UTC day (embeddings + extraction LLM), persisted
# in the store. Refusal at the cap is a disclosed degrade, never a silent bypass.
daily_token_cap = 200000
# Adaptive-policy flags (spec section 9). ON by default (user request 2026-11-07).
# Enabling any starts a NEW policy/evidence version (baseline feedback is never
# replayed into evidence afterward); disabling restores baseline serving, nothing
# deleted.
adaptive_ranking = true
adaptive_budget = true
query_clustering = true
cluster_floor = 0.35
# Session-end extraction LLM (defaults to the [llm] endpoint/model when unset).
llm_base_url = ""
llm_model = ""

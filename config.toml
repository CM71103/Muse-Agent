# Muse Agent - your live config. Copy to: %USERPROFILE%\.muse-agent\config.toml
# (i.e. C:\Users\chand\.muse-agent\config.toml)
# Or point the app at it:  set MUSE_CONFIG=D:\OpenSourceProg\Test\REA\muse-agent\config.toml

[llm]
provider = "openai-compat"
base_url = "https://api.hcnsec.cn/v1"
model = "Qwen3.8-Flash-Next"
api_key = "sk-mWtUKeTXjX373n1XZ9O2tsrvdiwZL0V2bXtW8Ui5YBQGhFkk"
api_key_env = "MUSE_LLM_API_KEY"
temperature = 0.3
max_tokens = 8192

# Other models available on this endpoint (swap model = "..." to switch):
#   DeepSeek-V4-Pro          - stronger, for hard tasks
#   DeepSeek-V4-Flash        - fast
#   glm-5.3 / glm-5.3-flash
#   MiniMax-M3.1-Flash
#   step-5-preview
#   auto                     - endpoint picks

[agent]
max_turns = 40
approval_timeout_s = 3600
always_ask_tools = ["shell"]
sandbox = "none"

[sentinel]
mode = "ask"
deny_rules = [
  "*rm -rf*",
  "*del /s*",
  "*format *",
  "*Remove-Item -Recurse*",
  "*shutdown*",
  "*reg delete*",
]
egress_allowlist = ["duckduckgo.com", "wikipedia.org", "github.com", "pypi.org"]

[hands]
enabled = false
host = "127.0.0.1"
port = 8788

[log]
level = "info"

[memory]
# Adaptive memory layer (Phase 0 baseline). OFF by default — it stores your
# conversation and tool results in ~/.muse-agent/memory/memory.json.
enabled = true
budget_tokens = 1200
score_cutoff = 0.20
project_id_strategy = "auto"
embed_model = "qwen3-embedding-0.6b"
embed_dims = 1024
